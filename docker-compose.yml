version: "3.9"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./resources:/app/resources:ro
      - db_data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/store_intelligence.db
      - CORS_ORIGINS=http://localhost:3000
      - APP_VERSION=1.0.0
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=https://visionretail-iq.onrender.com
      - NEXT_PUBLIC_BACKEND_URL=https://visionretail-iq.onrender.com
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data: